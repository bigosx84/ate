  <!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulario de Preguntas</title>
    <style>
        body {
            font-family: "Arial", sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f7fc;
            display: flex; flex-wrap: wrap;
            justify-content: center;
        }
        .container {
            width: 90%;
            max-width: 1200px;
            background-color: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .question {
            margin-bottom: 20px;
            padding: 15px;
            border-radius: 8px;
            background-color: #eef3ff;
            border-left: 5px solid #4a90e2;
        }
        .question label {
            font-size: 20px;
            font-weight: bold;
            color: #2c3e50;
            display: block;
            margin-bottom: 10px;
        }
        .options {
            list-style: none;
            padding: 0;
        }
        .option {
            display: flex;
            align-items: center;
            font-size: 17px; font-weight: normal;
            padding: 10px;
            border-radius: 5px;
            background-color: #ffffff;
            border: 1px solid #d1d8e0;
            margin-bottom: 8px;
            transition: background-color 0.3s;
            width: calc(100% - 20px); max-width: 100%;
        }
        .option:hover {
            background-color: #d9e8ff;
        }
        .option input[type="radio"] {
            margin-right: 10px;
        }
        .correct {
            background-color: #c8e6c9 !important;
            border-color: #4caf50;
            font-weight: bold;
        }
        .incorrect {
            background-color: #ffcdd2 !important;
            border-color: #e53935;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <form id="quizForm"></form>
    </div>
    
    <script>
        const questions = [
		    "question": "1. De los apoyos instrumentales para la locomoción, el más usado es:",
    "options": [
      "a) Sillas de ruedas.",
      "b) Gafas.",
      "c) Prótesis dentarias.",
      "d) Mesa plegable, adaptada."
    ],
    "correct": 0
  },
  {
    "question": "2. Respecto a los apoyos instrumentales, el cuidador:",
    "options": [
      "a) Cuidará su estado de conservación.",
      "b) Ayudará al niño para su desplazamiento.",
      "c) Observará el uso de los mismos e informará de problemas a tutor y padres.",
      "d) Todas son correctas."
    ],
    "correct": 3
  },
  {
    "question": "3. ¿Qué tipo de silla de ruedas es adecuada para personas con escaso control de tronco y/o cabeza o que presenten importantes movimientos involuntarios del cuerpo?",
    "options": [
      "a) Silla de ruedas estándar.",
      "b) Silla de ruedas neurológica.",
      "c) Silla de ruedas activa.",
      "d) Ninguna es correcta."
    ],
    "correct": 1
  },
      "question": "4. Un posicionador es:",
    "options": [
      "a) Una ayuda técnica para la sedestación.",
      "b) Una ayuda técnica para desplazamientos y transferencias.",
      "c) Una ayuda técnica para la bipedestación.",
      "d) Una ayuda técnica para el desarrollo de la marcha."
    ],
    "correct": 0
  },
  {
    "question": "5. El cuidador, para sacar a un niño de la silla de ruedas:",
    "options": [
      "a) Basculará la silla hacia un lado.",
      "b) Pedirá ayuda al profesor de apoyo.",
      "c) Lo cogerá por debajo de los brazos y lo incorporará.",
      "d) Apretará la palanca de vaciado."
    ],
    "correct": 2
  },
  {
    "question": "6. Cuando se habla de apoyos instrumentales para la alimentación, nos referimos a:",
    "options": [
      "a) Adaptación realizada en mesas y cubiertos para favorecer la autonomía personal en la alimentación.",
      "b) Cuando es necesario que los niños coman en la silla de ruedas.",
      "c) Cuando es preciso cambiar el tipo de comidas.",
      "d) Las mesas que tienen paralelas de apoyo."
    ],
    "correct": 0
  },
  {
    "question": "7. Los apoyos instrumentales para la alimentación afectarán a:",
    "options": [
      "a) Mesas y sillas.",
      "b) Cubiertos.",
      "c) Vasos.",
      "d) Todos los anteriores."
    ],
    "correct": 3
  },
  {
    "question": "8. En un aseo para alumnos con discapacidad motórica debe haber adaptaciones a nivel de:",
    "options": [
      "a) Barras de apoyo.",
      "b) Suelos antideslizantes.",
      "c) Cisterna próxima al retrete.",
      "d) Todas las anteriores."
    ],
    "correct": 3
  },
  {
    "question": "9. Cuando la persona con discapacidad no tiene incontinencia, pero necesita ayuda para ir al baño:",
    "options": [
      "a) Es preferible el uso de pañales.",
      "b) Hay que dar siempre prioridad a la utilización del WC.",
      "c) Hay que dar prioridad a la utilización del WC, solo en el caso de que no requiera adaptaciones en el baño.",
      "d) Hay que dar prioridad a la utilización del WC, solo en el caso de que no requiera que el personal de apoyo permanezca junto a él."
    ],
    "correct": 1
  },
  {
    "question": "10. La incontinencia urinaria puede deberse a:",
    "options": [
      "a) Urgencia: ganas de orinar tan repentina que no da tiempo a llegar al WC.",
      "b) Ubicación: la incontinencia puede ocurrir porque el acceso al WC es dificultoso, ya sea por lejanía, por número insuficiente o por elementos que dificulten el acceso.",
      "c) Pérdida de interés: la depresión y pérdida de interés consecuente puede hacer que la persona pierda la iniciativa para ir al WC y se desarrolle un problema de incontinencia.",
      "d) Todas son correctas."
    ],
    "correct": 3
  },
  {
    "question": "11. ¿Qué tipo de sillas de ruedas tienen un respaldo bajo que permite gran libertad de movimientos, por lo que está indicada para personas con buen control del tronco?",
    "options": [
      "a) Silla de ruedas estándar.",
      "b) Silla de ruedas neurológica.",
      "c) Silla de ruedas activa.",
      "d) Ninguna es correcta."
    ],
    "correct": 1
  },
  {
    "question": "12. Estas muletas presentan superficies forradas o acolchadas. Son utilizadas en pacientes que no pueden soportar la descarga del peso corporal sobre sus muñecas. Hablamos de:",
    "options": [
      "a) Muletas de aluminio o madera.",
      "b) Muletas de Lofstrand.",
      "c) Muletas para antebrazo.",
      "d) Muletas de plataforma."
    ],
    "correct": 3
  },
  {
    "question": "13. Al apoyarse sobre las muletas los codos del paciente deben quedar ligeramente flexionados formando un ángulo de:",
    "options": [
      "a) 15 grados.",
      "b) 25 grados.",
      "c) 45 grados.",
      "d) 90 grados."
    ],
    "correct": 0
  },
  {
    "question": "14. Los andadores permiten una marcha en:",
    "options": [
      "a) Dos tiempos.",
      "b) Tres tiempos.",
      "c) Cuatro tiempos.",
      "d) Seis tiempos."
    ],
    "correct": 1
  },
  {
    "question": "15. Es un orinal plano que se usa para la defecación, tanto del hombre como de la mujer, y para la micción de la mujer:",
    "options": [
      "a) Cuña.",
      "b) Bandeja de orina.",
      "c) Botella plana.",
      "d) Enema."
    ],
    "correct": 0
  }
         ];

        const form = document.getElementById('quizForm');

        questions.forEach((q, index) => {
            const questionDiv = document.createElement('div');
            questionDiv.classList.add('question');

            const label = document.createElement('label');
            label.textContent = q.question;
            questionDiv.appendChild(label);

            const optionsList = document.createElement('ul');
            optionsList.classList.add('options');

            q.options.forEach((option, i) => {
                const optionItem = document.createElement('li');
                optionItem.classList.add('option');

                const radio = document.createElement('input');
                optionItem.addEventListener('click', () => radio.click());
                radio.type = 'radio';
                radio.name = `question${index}`;
                radio.value = i;
                radio.addEventListener('change', () => {
                    if (i === q.correct) {
                        optionItem.classList.add('correct');
                        optionItem.classList.remove('incorrect');
                    } else {
                        optionItem.classList.add('incorrect');
                        optionItem.classList.remove('correct');
                    }
                });

                optionItem.appendChild(radio);
                optionItem.appendChild(document.createTextNode(option));
                optionsList.appendChild(optionItem);
            });

            questionDiv.appendChild(optionsList);
            form.appendChild(questionDiv);
        });
    </script>
</body>
</html>
